# GeoDrafter Stream Survey – VASP code table (generated by core/codemap.py vasp_table(); do not edit by hand).
#
# One code per VASP tag with VASPGPS's own field-code name; other names seen for the same tag are aliases.
# The point type of each tag is GeoDrafter's interpretation (core/vasp.py).
name: VASP codes (VASPGPS)
description: VASP/VASPGPS field codes, typed by their VASP tag. Numbered variants
  of the names (e.g. 17ProfilKant) are recognised automatically on import.
case_sensitive: false
prefix_match: true
attributes:
  Profil: Integer
  Diameter_mm: Number
  Materiale: List (Beton; Plast; Ler; Stål; Andet)
  Retning: List (Indløb; Udløb)
profile_attribute: Profil
codes:
- code: PROFILSTARTV
  type: terrain
  description: 'VASP tag 100: first point of a cross-section, left side'
  role: section_start
- code: PROFILSTARTH
  type: terrain
  description: 'VASP tag 101: first point of a cross-section, right side'
  role: section_start
- code: PROFILPKT
  type: knick
  description: 'VASP tag 110: ordinary cross-section point'
- code: PROFILPKTK
  type: bank_top
  description: 'VASP tag 111: cross-section point with an edge mark (bank top)'
  aliases:
  - PROFILKANT
- code: VANDSPEJL
  type: water_level
  description: 'VASP tag 112: cross-section point that is also the water level'
- code: MIDTSTROMS
  type: bed
  description: 'VASP tag 113: cross-section point in mid-stream'
  aliases:
  - PROFILMIDT
- code: PROFILPKTPPILLE
  type: knick
  description: 'VASP tag 114: cross-section point at a bridge pier'
  aliases:
  - PROFILPKTPILLE
- code: PROFBRODAEK
  type: bridge_deck
  description: 'VASP tag 120: top of the bridge deck in a cross-section'
  aliases:
  - PROFILBRODEK
  - PROFILBRODAEK
- code: PROFILSLUT
